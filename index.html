<style>
/* ===================== GLOBAL ===================== */
* { box-sizing: border-box; }

html, body {
    margin: 0;
    min-height: 100%;
    background: #07040d;
    font-family: "Playpen Sans", "Segoe UI", system-ui, sans-serif;
    color: #ff9d42;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 14px;
}

/* ===================== BACKGROUND BLOBS ===================== */
.blobs {
    position: fixed;
    inset: -150px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.blob {
    position: absolute;
    border-radius: 55% 45% 62% 38% / 42% 58% 45% 55%;
    filter: blur(40px);
    mix-blend-mode: screen;
    will-change: transform, border-radius;
}

.blob-1 {
    width: 520px; height: 400px; left: -60px; top: -100px; opacity: .7;
    background: radial-gradient(ellipse at 35% 35%, rgba(164,105,255,.45) 0%, rgba(126,66,255,.30) 32%, rgba(91,45,220,.15) 55%, transparent 100%);
    animation: blobFloat1 7s ease-in-out infinite;
}
.blob-2 {
    width: 560px; height: 440px; right: -80px; top: 10%; opacity: .68;
    background: radial-gradient(ellipse at 40% 40%, rgba(180,120,255,.42) 0%, rgba(135,70,255,.28) 35%, rgba(95,30,238,.14) 60%, transparent 100%);
    animation: blobFloat2 8.5s ease-in-out infinite;
}
.blob-3 {
    width: 580px; height: 420px; left: 25%; bottom: -160px; opacity: .65;
    background: radial-gradient(ellipse at 50% 40%, rgba(150,90,255,.38) 0%, rgba(110,45,230,.22) 38%, rgba(75,20,190,.10) 62%, transparent 100%);
    animation: blobFloat3 9s ease-in-out infinite;
}
.blob-4 {
    width: 480px; height: 380px; right: 20%; top: -180px; opacity: .65;
    background: radial-gradient(ellipse at 50% 50%, rgba(190,110,255,.45) 0%, rgba(120,50,250,.28) 40%, rgba(80,20,200,.12) 65%, transparent 100%);
    animation: blobFloat4 8s ease-in-out infinite;
}

@keyframes blobFloat1 {
    0%   { transform: translate3d(0,0,0) rotate(0) scale(1); }
    20%  { transform: translate3d(110px,45px,0) rotate(18deg) scale(1.18); border-radius: 42% 58% 35% 65% / 60% 40% 55% 45%; }
    40%  { transform: translate3d(160px,110px,0) rotate(-14deg) scale(.88); border-radius: 65% 35% 48% 52% / 38% 62% 42% 58%; }
    65%  { transform: translate3d(70px,140px,0) rotate(22deg) scale(1.22); border-radius: 38% 62% 60% 40% / 55% 40% 60% 45%; }
    100% { transform: translate3d(0,0,0) rotate(0) scale(1); }
}
@keyframes blobFloat2 {
    0%   { transform: translate3d(0,0,0) rotate(0) scale(1); }
    25%  { transform: translate3d(-110px,70px,0) rotate(-20deg) scale(1.22); border-radius: 35% 65% 58% 42% / 62% 38% 55% 45%; }
    50%  { transform: translate3d(-170px,-20px,0) rotate(14deg) scale(.86); border-radius: 62% 38% 40% 60% / 42% 60% 38% 62%; }
    75%  { transform: translate3d(-60px,-90px,0) rotate(-10deg) scale(1.18); }
    100% { transform: translate3d(0,0,0) rotate(0) scale(1); }
}
@keyframes blobFloat3 {
    0%   { transform: translate3d(0,0,0) rotate(0) scale(1); }
    20%  { transform: translate3d(-100px,-70px,0) rotate(16deg) scale(1.18); }
    45%  { transform: translate3d(60px,-110px,0) rotate(-18deg) scale(.88); }
    70%  { transform: translate3d(160px,-40px,0) rotate(14deg) scale(1.2); }
    100% { transform: translate3d(0,0,0) rotate(0) scale(1); }
}
@keyframes blobFloat4 {
    0%   { transform: translate3d(0,0,0) rotate(0) scale(1); }
    25%  { transform: translate3d(-70px,45px,0) rotate(18deg) scale(1.15); }
    50%  { transform: translate3d(-130px,100px,0) rotate(-16deg) scale(.85); }
    75%  { transform: translate3d(-50px,50px,0) rotate(12deg) scale(1.18); }
    100% { transform: translate3d(0,0,0) rotate(0) scale(1); }
}

/* ===================== CARD ===================== */
.card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
    padding: 34px 28px 30px;
    border-radius: 36px;
    overflow: hidden;
    text-align: center;
    background: linear-gradient(135deg, rgba(18,10,30,.92), rgba(8,5,16,.95));
    box-shadow: 0 0 45px 6px rgba(110,45,230,.28), inset 0 0 0 1px rgba(164,105,255,.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    animation: cardAppear .8s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardAppear {
    from { opacity: 0; transform: translateY(15px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

.glow {
    position: absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    filter: blur(75px);
    pointer-events: none;
}
.glow-left  { left: -170px; top: -180px;  background: rgba(135,65,255,.18); animation: glowPulse 5s ease-in-out infinite alternate; }
.glow-right { right: -170px; bottom: -190px; background: rgba(110,45,230,.17); animation: glowPulse 5.5s ease-in-out infinite alternate; }

@keyframes glowPulse {
    from { transform: scale(.9); opacity: .5; }
    to   { transform: scale(1.2); opacity: .85; }
}

/* ===================== PARTICLES ===================== */
.particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}
.particle {
    position: absolute;
    bottom: -10px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #b77aff;
    opacity: 0;
    animation: floatUp linear infinite;
}
.particle:nth-child(1) { left: 8%;  animation-duration: 7s;   animation-delay: 0s; }
.particle:nth-child(2) { left: 22%; animation-duration: 9s;   animation-delay: 2s; }
.particle:nth-child(3) { left: 38%; animation-duration: 6s;   animation-delay: 1s; }
.particle:nth-child(4) { left: 57%; animation-duration: 8s;   animation-delay: 3s; background: #ffb35c; }
.particle:nth-child(5) { left: 74%; animation-duration: 7.5s; animation-delay: 1.5s; }
.particle:nth-child(6) { left: 91%; animation-duration: 10s;  animation-delay: 4s; background: #ffb35c; }
.particle:nth-child(7) { left: 48%; animation-duration: 11s;  animation-delay: 5s; }
.particle:nth-child(8) { left: 66%; animation-duration: 8.5s; animation-delay: 6s; }

@keyframes floatUp {
    0%   { transform: translateY(0) scale(.5); opacity: 0; }
    15%  { opacity: .7; }
    70%  { opacity: .35; }
    100% { transform: translateY(-420px) scale(1.2); opacity: 0; }
}

.content { position: relative; z-index: 3; }

/* ===================== LOGO ===================== */
.logo-wrap {
    position: relative;
    width: min(300px, 74vw);
    margin: -6px auto 0;
    animation: logoFloat 5s ease-in-out infinite;
}
.logo-wrap::before {               /* мягкий ореол: голубой в центре -> фиолетовый -> фон */
    content: "";
    position: absolute;
    inset: 8% 4%;
    border-radius: 50%;
    background: radial-gradient(circle,
        rgba(70,150,255,.32) 0%,
        rgba(120,70,255,.26) 38%,
        rgba(110,45,230,.12) 62%,
        transparent 78%);
    filter: blur(30px);
    animation: logoGlow 3.2s ease-in-out infinite alternate;
}
.logo {
    position: relative;
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 0 10px rgba(90,170,255,.45)) drop-shadow(0 0 26px rgba(130,70,255,.35));
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
}
@keyframes logoGlow {
    from { opacity: .55; transform: scale(.95); }
    to   { opacity: 1;   transform: scale(1.1); }
}

/* ===================== TITLE ===================== */
.title {
    margin: 0;
    font-size: clamp(28px, 8vw, 42px);
    line-height: 1.15;
    font-weight: 800;
    color: #ffa44f;
    animation: titlePulse 2.4s ease-in-out infinite alternate;
}
@keyframes titlePulse {
    0%   { text-shadow: 0 0 8px rgba(255,120,30,.45), 0 0 16px rgba(255,75,10,.25); }
    50%  { color: #ffbe7a; text-shadow: 0 0 16px rgba(255,175,70,.9), 0 0 32px rgba(255,115,25,.75), 0 0 52px rgba(255,60,0,.5); }
    100% { text-shadow: 0 0 8px rgba(255,120,30,.45), 0 0 16px rgba(255,75,10,.25); }
}

.subtitle {
    margin: 8px 0 26px;
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,160,95,.6);
}

/* ===================== BUTTONS ===================== */
.links {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 10px;
    min-height: 58px;
    padding: 14px 20px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    overflow: hidden;
    isolation: isolate;
    transition: transform .2s ease, filter .2s ease;
}
.nw { white-space: nowrap; }
.br { display: none; }
.btn svg { width: 22px; height: 22px; flex-shrink: 0; }
.btn:hover  { filter: brightness(1.12); }
.btn:active { transform: scale(.97); }

/* Telegram */
.btn-tg {
    color: #d9c4ff;
    background: rgba(135,65,255,.12);
    box-shadow: inset 0 0 0 1.5px rgba(164,105,255,.45), 0 0 18px rgba(126,66,255,.2);
}
.btn-tg:hover { background: rgba(135,65,255,.22); }

/* Donate */
.btn-donate {
    color: #2a0e00;
    background: linear-gradient(90deg, #ff4b1f 0%, #ff7324 40%, #ff9436 75%, #ffc04d 100%);
    background-size: 200% 100%;
    animation: donatePulse 1.8s ease-in-out infinite, gradientMove 4s linear infinite;
}
.btn-donate + .btn-donate { animation-delay: .9s, 0s; }

.btn-donate::before {           /* бегущий блик, как на прогресс-баре */
    content: "";
    position: absolute;
    top: 0; left: -120px;
    width: 100px; height: 100%;
    z-index: -1;
    background: linear-gradient(90deg, transparent, rgba(255,240,200,.75) 50%, transparent);
    transform: skewX(-20deg);
    animation: shine 2.6s linear infinite;
}
.btn-donate + .btn-donate::before { animation-delay: 1.3s; }

.btn-donate .tag {
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
    font-size: 14px;
    background: rgba(40,10,0,.18);
}
.btn-donate .heart { animation: heartBeat 1.8s ease-in-out infinite; }
.btn-donate + .btn-donate .heart { animation-delay: .9s; }

@keyframes donatePulse {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 12px rgba(255,100,30,.45), 0 0 0 0 rgba(255,120,40,.55);
    }
    50% {
        transform: scale(1.045);
        box-shadow: 0 0 28px rgba(255,140,40,.85), 0 0 55px rgba(255,75,15,.45), 0 0 0 10px rgba(255,120,40,0);
    }
}
@keyframes gradientMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
@keyframes shine {
    from { left: -120px; }
    to   { left: 120%; }
}
@keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.25); }
    40%      { transform: scale(.95); }
    55%      { transform: scale(1.15); }
}

.footer {
    margin-top: 24px;
    font-size: 13px;
    color: rgba(255,150,80,.4);
}

@media (max-width: 560px) {
    body { padding: 12px 10px; }
    .card { padding: 26px 16px 22px; border-radius: 28px; }
    .logo-wrap { width: min(290px, 80vw); }
    .subtitle { font-size: 15px; margin-bottom: 22px; }
    .links { gap: 14px; }
    .btn { font-size: 16px; min-height: 56px; padding: 11px 16px; }
    .btn-tg { font-size: 17px; }
    .br { display: block; flex-basis: 100%; height: 0; }   /* метка всегда на второй строке */
    .btn-donate .tag { font-size: 12.5px; }
    @keyframes donatePulse {
        0%, 100% { transform: scale(1);    box-shadow: 0 0 10px rgba(255,100,30,.45); }
        50%      { transform: scale(1.03); box-shadow: 0 0 22px rgba(255,140,40,.8), 0 0 40px rgba(255,75,15,.4); }
    }
}

@media (max-width: 340px) {
    .btn { font-size: 14.5px; }
    .title { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
